services:
  postgres:
    image: postgres:15
    container_name: credit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xai_user
      POSTGRES_PASSWORD: xai_password
      POSTGRES_DB: xai_lending
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xai_user -d xai_lending"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: credit_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://xai_user:xai_password@postgres:5432/xai_lending

  frontend:
    build: ./frontend
    container_name: credit_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8000

volumes:
  pgdata: